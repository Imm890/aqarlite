services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: aqarlite
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aqarlite-pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  aqarlite-pgdata:
